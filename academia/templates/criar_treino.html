<script>
    // Declarar a variável exercises globalmente
    let exercises = [];

    // Função para carregar exercícios do servidor
    function loadExercises() {
        $.ajax({
            url: '/get_exercises',
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                exercises = data;
                renderExercises(exercises);
            },
            error: function(xhr, status, error) {
                console.error('Erro ao carregar exercícios:', error);
                alert('Erro ao carregar exercícios. Verifique o console para detalhes.');
            }
        });
    }

    // Renderizar exercícios
    function renderExercises(exerciseList) {
        const container = $('#exercises-container');
        container.empty();

        if (!exerciseList || exerciseList.length === 0) {
            container.html('<div class="col-12"><div class="alert alert-info">Nenhum exercício encontrado.</div></div>');
            return;
        }

        exerciseList.forEach(ex => {
            const exerciseCard = `
                <div class="col-md-6" data-group="${ex.muscleGroup}">
                    <div class="card card-exercise">
                        <div class="card-body">
                            <h5 class="card-title">${ex.nome}</h5>
                            <p class="card-text">${ex.descricao || 'Sem descrição'}</p>
                            <p class="card-text"><strong>Equipamento:</strong> ${ex.equipamento || 'Nenhum'}</p>
                            <p class="card-text">
                                <strong>Grupo Muscular:</strong>
                                <span class="muscle-group">${ex.muscleGroup}</span>
                            </p>
                            <div class="d-flex justify-content-between">
                                <button class="btn btn-add add-exercise" data-id="${ex.id}">
                                    Adicionar
                                </button>
                                <a href="${ex.video}" target="_blank" class="btn btn-link">
                                    Ver Vídeo
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.append(exerciseCard);
        });
    }

    // Configurar listeners de eventos
    function setupEventListeners() {
        // Busca de exercícios
        $('#exercise-search').on('input', function() {
            const searchTerm = $(this).val().toLowerCase();
            const filtered = exercises.filter(exercise => {
                return (exercise.nome && exercise.nome.toLowerCase().includes(searchTerm)) ||
                       (exercise.descricao && exercise.descricao.toLowerCase().includes(searchTerm));
            });
            renderExercises(filtered);
        });

        // Filtro por grupo muscular
        $('.filter-btn').click(function() {
            $('.filter-btn').removeClass('active');
            $(this).addClass('active');
            const group = $(this).data('group');

            if (group === 'all') {
                renderExercises(exercises);
            } else {
                // Mapear para os valores do banco
                const groupMap = {
                    'peito': 'Peito',
                    'costas': 'Costas',
                    'pernas': 'Perna',
                    'alongamento': 'Alongamento',
                    'bracos': 'Braço',
                    'abdomen': 'Abdome'
                };

                const dbGroup = groupMap[group] || group;
                const filtered = exercises.filter(ex => ex.muscleGroup === dbGroup);
                renderExercises(filtered);
            }
        });

        // Adicionar exercício ao treino
        $(document).on('click', '.add-exercise', function() {
            const exerciseId = parseInt($(this).data('id'));
            const exercise = exercises.find(e => e.id === exerciseId);

            if (exercise) {
                addExerciseToWorkout(exercise);
            }
        });

        // Remover exercício do treino
        $(document).on('click', '.btn-remove', function() {
            const exerciseId = $(this).data('id');
            $(`#exercise-${exerciseId}`).remove();
            updateExerciseCounter();
        });

        // Salvar treino
        $('#save-workout').click(function() {
            const workoutName = $('#workout-name').val().trim();
            if (!workoutName) {
                alert('Por favor, dê um nome ao seu treino');
                return;
            }

            const selectedExercises = [];
            $('.workout-item').each(function() {
                selectedExercises.push($(this).data('id'));
            });

            if (selectedExercises.length === 0) {
                alert('Adicione pelo menos um exercício ao treino');
                return;
            }

            // Enviar para o servidor
            $.ajax({
                url: '/save_workout',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    workout_name: workoutName,
                    exercise_ids: selectedExercises
                }),
                success: function(response) {
                    if (response.success) {
                        alert(`Treino "${workoutName}" salvo com sucesso!`);
                        window.location.href = '/treinos';
                    } else {
                        alert('Erro ao salvar treino: ' + response.message);
                    }
                },
                error: function() {
                    alert('Erro ao salvar treino. Tente novamente.');
                }
            });
        });
    }

    // Adicionar exercício ao resumo do treino
    function addExerciseToWorkout(exercise) {
        const exerciseItem = `
            <div class="workout-item" id="exercise-${exercise.id}" data-id="${exercise.id}">
                <div>
                    <strong>${exercise.nome}</strong>
                    <div>${exercise.muscleGroup}</div>
                </div>
                <button class="btn-remove" data-id="${exercise.id}">
                    Remover
                </button>
            </div>
        `;

        $('#selected-exercises').append(exerciseItem);
        updateExerciseCounter();
    }

    // Atualizar contador de exercícios
    function updateExerciseCounter() {
        const count = $('.workout-item').length;
        $('#exercise-counter').text(`(${count})`);
    }

    // Inicializar a página
    $(document).ready(function() {
        loadExercises();
        setupEventListeners();
    });
</script>
